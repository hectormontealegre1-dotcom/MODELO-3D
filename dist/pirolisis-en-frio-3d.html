<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Banco de plasma frío DBD en 3D: entorno, despiece, instrumentación y simulación didáctica basada en la revisión bibliográfica del seminario «Pirólisis en frío».">
<title>Banco de pirólisis en frío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Diseño: visor 3D a pantalla completa como mesa de laboratorio; consola de proceso a la izquierda,
   instrumentación a la derecha y una lupa sobre la zona de descarga. En móvil, bandeja inferior con pestañas.
   Paleta: violeta de la emisión del N₂ (337–391 nm) como acento, amarillo de seguridad para la alta tensión,
   neutros acero con sesgo azul. */
:root {
  --bg: #e6eaee;
  --scene-bg: #dce2e7;
  --surface: rgba(250, 251, 252, 0.94);
  --surface-solid: #fafbfc;
  --surface-2: #eef1f4;
  --ink: #111921;
  --ink-2: #43505d;
  --muted: #687582;
  --line: #d2d9e0;
  --accent: #5a3fd1;
  --accent-soft: #ebe7ff;
  --accent-ink: #ffffff;
  --hv: #f2b705;
  --hv-ink: #1a1400;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --crit: #d03b3b;
  --chart-grid: #e1e0d9;
  --chart-axis: #c3c2b7;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --sp-O: #2a78d6;
  --sp-O3: #1baf7a;
  --sp-OH: #e87ba4;
  --sp-H2O2: #eda100;
  --sp-NOx: #eb6834;
  --sp-N2: #4a3aa7;
  --sp-UV: #e34948;
  --shadow: 0 1px 2px rgba(17, 25, 33, 0.06), 0 8px 24px rgba(17, 25, 33, 0.08);
  --velo: rgba(226, 231, 236, 0.78);
  --pres-h: 128px;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --izq: 308px;
  --der: 368px;
  --barra: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f15;
    --scene-bg: #0e131a;
    --surface: rgba(18, 24, 32, 0.94);
    --surface-solid: #121820;
    --surface-2: #1a222c;
    --ink: #e7ecf2;
    --ink-2: #b4bfca;
    --muted: #8592a0;
    --line: #263140;
    --accent: #9d8aff;
    --accent-soft: #241f45;
    --accent-ink: #0d0a1f;
    --hv: #ffc23d;
    --good-ink: #0ca30c;
    --chart-grid: #222b36;
    --chart-axis: #3a4655;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --sp-O: #3987e5;
    --sp-O3: #199e70;
    --sp-OH: #d55181;
    --sp-H2O2: #c98500;
    --sp-NOx: #d95926;
    --sp-N2: #9085e9;
    --sp-UV: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
    --velo: rgba(9, 12, 17, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f15;
  --scene-bg: #0e131a;
  --surface: rgba(18, 24, 32, 0.94);
  --surface-solid: #121820;
  --surface-2: #1a222c;
  --ink: #e7ecf2;
  --ink-2: #b4bfca;
  --muted: #8592a0;
  --line: #263140;
  --accent: #9d8aff;
  --accent-soft: #241f45;
  --accent-ink: #0d0a1f;
  --hv: #ffc23d;
  --good-ink: #0ca30c;
  --chart-grid: #222b36;
  --chart-axis: #3a4655;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --sp-O: #3987e5;
  --sp-O3: #199e70;
  --sp-OH: #d55181;
  --sp-H2O2: #c98500;
  --sp-NOx: #d95926;
  --sp-N2: #9085e9;
  --sp-UV: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  --velo: rgba(9, 12, 17, 0.8);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.45 var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; width: 100%; overflow: hidden; }
#visor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- barra superior ---------- */
.barra {
  position: absolute; top: 0; left: 0; right: 0; height: var(--barra);
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px; padding-top: env(safe-area-inset-top, 0px);
  background: var(--surface); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px); z-index: 5;
}
.marca { display: flex; flex-direction: column; min-width: 0; }
.marca small {
  font: 600 11px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.marca strong { font: 700 22px/1.05 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; }
.estado { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.pastilla {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font: 600 13px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.pastilla i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.pastilla[data-at="1"] { background: var(--hv); color: var(--hv-ink); border-color: transparent; }
.pastilla[data-at="1"] i { background: var(--hv-ink); animation: latido 0.8s infinite; }
.pastilla[data-fase="listo"] i { background: var(--good); }
.pastilla[data-fase="purga"] i, .pastilla[data-fase="postpurga"] i { background: var(--s1); }
@keyframes latido { 50% { opacity: 0.25; } }
.reloj { font: 500 13px/1 var(--font-data); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface-solid); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.barra .boton { gap: 0; }
.boton:hover { border-color: var(--accent); }
.boton.primario { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.boton.peligro { background: var(--crit); color: #fff; border-color: transparent; font-weight: 600; }
.boton[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.boton:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- barra de vistas ---------- */
.vistas {
  position: absolute; top: calc(var(--barra) + 10px); left: calc(var(--izq) + 24px); right: calc(var(--der) + 24px);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; z-index: 4; pointer-events: none;
}
.vistas > * { pointer-events: auto; }
.grupo-seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
.grupo-seg button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 5px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.grupo-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.control-despiece { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
.control-despiece label { font: 600 12px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.control-despiece output { font: 500 12px/1 var(--font-data); width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- paneles ---------- */
.panel {
  position: absolute; top: calc(var(--barra) + 10px); bottom: 12px; z-index: 4;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}
.panel.izq { left: 12px; width: var(--izq); }
.panel.der { right: 12px; width: var(--der); }
.panel > header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
.panel > header h2 { margin: 0; font: 700 17px/1.1 var(--font-display); letter-spacing: 0.02em; }
.panel > header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.desliza { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1; }
.seccion { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.seccion:last-child { border-bottom: 0; }
.seccion h3 {
  margin: 0; font: 600 12px/1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.seccion h3 span { font: 500 11px/1 var(--font-data); letter-spacing: 0; text-transform: none; color: var(--muted); }

select.campo, input.campo {
  width: 100%; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-solid);
}
.fila-rango { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.fila-rango label { font-size: 12px; color: var(--ink-2); }
.fila-rango output { font: 500 12px/1 var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.fila-rango input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.ayuda { font-size: 11.5px; color: var(--muted); margin: 0; }
.ayuda b { color: var(--ink-2); font-weight: 600; }

.tarjeta-caso { display: grid; gap: 6px; padding: 10px; border-radius: 8px; background: var(--surface-2); }
.tarjeta-caso dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 12px; }
.tarjeta-caso dt { color: var(--muted); }
.tarjeta-caso dd { margin: 0; min-width: 0; }
.resultado-ref { font: 500 12.5px/1.35 var(--font-data); color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font: 600 11px/1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--line); background: var(--surface-solid); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 2px; }
.chip[data-estado="dentro"] i { background: var(--good); }
.chip[data-estado="parcial"] i { background: var(--warn); }
.chip[data-estado="fuera"] i { background: var(--crit); }
.lista-motivos { margin: 0; padding-left: 16px; font-size: 12px; color: var(--ink-2); display: grid; gap: 2px; }
.ajustes { margin: 0; padding: 8px 10px 8px 24px; border-radius: 6px; border: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-2); display: grid; gap: 3px; }
.ajustes:empty { display: none; }
.cita { font-size: 11px; color: var(--muted); }

.composicion { display: flex; flex-wrap: wrap; gap: 4px; }
.composicion span { font: 500 11px/1 var(--font-data); padding: 4px 6px; border-radius: 4px; background: var(--surface-2); }
.segmentado { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 7px; padding: 3px; gap: 3px; }
.segmentado button { border: 0; height: 28px; border-radius: 5px; background: transparent; cursor: pointer; font-weight: 500; }
.segmentado button[aria-pressed="true"] { background: var(--surface-solid); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.encendido { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); font-size: 12px; }
.encendido b { font: 600 12px/1 var(--font-data); }
.encendido .marca-estado { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.encendido[data-ok="1"] .marca-estado { background: var(--good); }
.encendido[data-ok="0"] .marca-estado { background: var(--crit); }
.botonera { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.botonera.dos { grid-template-columns: 1fr 1fr; }

.secuencia { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: paso; }
.secuencia li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.secuencia li::before { counter-increment: paso; content: counter(paso); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--font-data); border: 1px solid var(--line); }
.secuencia li[data-estado="hecho"] { color: var(--ink-2); }
.secuencia li[data-estado="hecho"]::before { content: "✓"; background: var(--surface-2); }
.secuencia li[data-estado="activo"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.secuencia li[data-estado="activo"]::before { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.secuencia li small { font: 500 11px/1 var(--font-data); color: var(--muted); }
.bitacora { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-2); }
.bitacora li { display: grid; grid-template-columns: 54px 1fr; gap: 6px; }
.bitacora time { font: 500 11px/1.45 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- instrumentación ---------- */
.lecturas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
.lectura { background: var(--surface-solid); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.lectura small { font: 600 10px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lectura b { font: 600 17px/1.1 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lectura b span { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.pestanas { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.pestanas button { border: 0; background: transparent; height: 32px; padding: 0 10px; cursor: pointer; font: 600 14px/1 var(--font-display); letter-spacing: 0.04em; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.pestanas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.grafico { width: 100%; display: block; }
.grafico.alto { height: 200px; }
.grafico.medio { height: 170px; }
.tabla-datos { width: 100%; border-collapse: collapse; font-size: 12px; }
.tabla-datos td, .tabla-datos th { padding: 4px 0; border-bottom: 1px solid var(--line); text-align: left; font-weight: 400; }
.tabla-datos th { color: var(--muted); }
.tabla-datos td:last-child { text-align: right; font: 500 12px/1.4 var(--font-data); font-variant-numeric: tabular-nums; }
.tabla-datos tr:last-child td, .tabla-datos tr:last-child th { border-bottom: 0; }
.barras { display: grid; gap: 6px; }
.barra-esp { display: grid; grid-template-columns: 62px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; }
.barra-esp .pista { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.barra-esp .pista i { display: block; height: 100%; border-radius: 0 4px 4px 0; transition: width 0.25s; }
.barra-esp output { font: 500 11px/1 var(--font-data); text-align: right; color: var(--ink-2); }
.barra-esp span { display: flex; align-items: center; gap: 6px; }
.barra-esp span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.te-card { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.te-card div { padding: 8px 10px; border-radius: 6px; background: var(--surface-2); display: grid; gap: 2px; }
.te-card small { font-size: 11px; color: var(--muted); }
.te-card b { font: 600 15px/1.2 var(--font-data); font-variant-numeric: tabular-nums; }
.ecuacion { font: 500 12px/1.4 var(--font-data); color: var(--ink-2); padding: 6px 8px; border-left: 2px solid var(--accent); background: var(--surface-2); }
.leyenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--ink-2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 14px; height: 2px; background: var(--c); border-radius: 1px; }
.balance { display: flex; height: 26px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface-solid); }
.balance i { display: block; height: 100%; min-width: 2px; }
.balance i.desconocido { background-image: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 7px); background-color: var(--surface-2); }
.aviso-ref { font-size: 11.5px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.aviso-ref[data-tipo="no"] { border-left: 3px solid var(--warn); }
.notas { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }

/* ---------- lupa, pieza y alarmas ---------- */
.lupa {
  position: absolute; right: calc(var(--der) + 24px); bottom: 12px; width: 340px; height: 236px; z-index: 3;
  border-radius: 10px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; pointer-events: none;
}
.lupa header { position: absolute; top: 0; left: 0; right: 0; padding: 7px 10px; display: flex; justify-content: space-between; gap: 8px; background: linear-gradient(rgba(11, 15, 22, 0.85), rgba(11, 15, 22, 0)); color: #e7ecf2; }
.lupa header b { font: 600 13px/1.1 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; }
.lupa header small { font: 500 10.5px/1.2 var(--font-data); color: #b4bfca; text-align: right; }
.lupa .leyenda-lupa { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; background: linear-gradient(rgba(11, 15, 22, 0), rgba(11, 15, 22, 0.88)); color: #e7ecf2; font: 500 10.5px/1.2 var(--font-data); }
.lupa .leyenda-lupa span { display: inline-flex; align-items: center; gap: 4px; }
.lupa .leyenda-lupa i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pieza {
  position: absolute; left: calc(var(--izq) + 24px); bottom: 12px; width: 300px; z-index: 4;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
  padding: 12px 14px; display: grid; gap: 8px;
}
.pieza header { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
.pieza .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--font-data); background: var(--accent); color: var(--accent-ink); }
.pieza .num:empty { display: none; }
.pieza h4 { margin: 0; font: 700 17px/1.15 var(--font-display); }
.pieza .grupo { font: 600 11px/1 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pieza dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; }
.pieza dt { color: var(--muted); }
.pieza dd { margin: 0; }
.cerrar { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-solid); cursor: pointer; line-height: 1; }
.respaldo { font-size: 11.5px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.respaldo b { font-weight: 600; }
.alarmas { position: absolute; left: calc(var(--izq) + 24px); top: calc(var(--barra) + 104px); z-index: 4; display: grid; gap: 6px; width: 300px; }
.alarma { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px; backdrop-filter: blur(10px); }
.alarma b { font: 700 11px/1.6 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; }
.alarma[data-nivel="critica"] b { background: var(--crit); color: #fff; }
.alarma[data-nivel="aviso"] b { background: var(--warn); color: #1a1400; }
.alarma[data-nivel="info"] b { background: var(--surface-2); color: var(--ink-2); }

.lista-despiece {
  position: absolute; right: calc(var(--der) + 24px); bottom: 12px; width: 196px; z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
  padding: 10px 12px; display: grid; gap: 6px;
}
.lista-despiece header { display: grid; gap: 1px; }
.lista-despiece header b { font: 700 15px/1.1 var(--font-display); letter-spacing: 0.02em; }
.lista-despiece header small { font-size: 11px; color: var(--muted); }
.lista-despiece ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.lista-despiece button { display: grid; grid-template-columns: 20px 1fr; gap: 6px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 2px 4px; border-radius: 5px; cursor: pointer; font-size: 12px; line-height: 1.2; white-space: nowrap; }
.lista-despiece button:hover, .lista-despiece button[aria-pressed="true"] { background: var(--accent-soft); }
.lista-despiece button b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 600 10.5px/1 var(--font-data); }

/* ---------- portada del experimento ---------- */
.portada {
  position: absolute; left: 0; right: 0; top: var(--barra); bottom: 0; z-index: 30; overflow: auto;
  display: grid; place-items: center; padding-block: 24px; padding-inline: 16px;
  background: var(--velo); backdrop-filter: blur(4px);
}
.portada-tarjeta {
  width: min(clamp(880px, 58vw, 1120px), 100%); background: var(--surface-solid); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow); padding: 28px 32px; display: grid; gap: 16px;
}
.portada .eyebrow { margin: 0; font: 600 12.5px/1.2 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.portada h1 { margin: 0; font: 700 clamp(30px, 3.2vw, 58px)/1.02 var(--font-display); letter-spacing: 0.005em; text-wrap: balance; }
.portada .subtitulo { margin: -8px 0 0; font-size: clamp(14px, 0.85vw, 16.5px); line-height: 1.4; color: var(--ink-2); max-width: 80ch; }
.notas-orador {
  position: absolute; right: 16px; bottom: calc(var(--pres-h) + 24px); width: min(clamp(460px, 32vw, 640px), calc(100% - 32px)); z-index: 8;
  max-height: calc(100% - var(--barra) - var(--pres-h) - 56px); overflow: auto;
  background: var(--surface-solid); border: 1px solid var(--accent); border-radius: 12px; box-shadow: var(--shadow);
  padding: 14px 16px; display: grid; gap: 10px;
}
.notas-orador header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.notas-orador header b { font: 700 15px/1.1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.notas-orador header small { font: 500 11.5px/1 var(--font-data); color: var(--muted); }
.notas-orador p { margin: 0; font-size: clamp(15px, 0.95vw, 18px); line-height: 1.55; }
.notas-orador dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: clamp(12.5px, 0.8vw, 15px); }
.notas-orador dt { color: var(--muted); }
.notas-orador dd { margin: 0; }
.portada .pregunta { margin: 0; font-size: clamp(17px, 1.05vw, 21px); line-height: 1.45; max-width: 66ch; text-wrap: pretty; }
.hipotesis { display: grid; gap: 4px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: clamp(14.5px, 0.85vw, 17px); line-height: 1.45; }
.hipotesis b { font: 600 12px/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.variables { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.variables div { background: var(--surface-solid); padding: 10px 12px; display: grid; gap: 4px; align-content: start; }
.variables dt { font: 600 11.5px/1.2 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.variables dd { margin: 0; font-size: clamp(13px, 0.78vw, 15.5px); line-height: 1.45; }
.portada-acciones { display: flex; flex-wrap: wrap; gap: 10px; }
.boton.grande { height: 44px; padding: 0 18px; font-size: 15px; border-radius: 8px; }
.portada .nota { margin: 0; font-size: clamp(12px, 0.7vw, 14px); line-height: 1.5; color: var(--muted); max-width: 84ch; }

/* ---------- recorrido guiado ---------- */
.barra-pres {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 7; min-height: 128px;
  display: grid; gap: 8px; padding: 8px 16px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
}
.bp-segmentos { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 4px; }
.bp-seg { position: relative; height: 16px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.bp-seg::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 8px; border-radius: 4px; background: var(--line); }
.bp-seg:hover::before { background: var(--muted); }
.bp-seg i { position: absolute; left: 0; top: 4px; height: 8px; width: 0; border-radius: 4px; background: var(--accent); }
.bp-seg[data-estado="hecho"] i { opacity: 0.5; }
.bp-seg[data-excedido="1"] i { background: var(--warn); }
.bp-cuerpo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; }
.bp-meta { display: grid; grid-template-columns: auto auto; align-items: baseline; gap: 4px 6px; min-width: 96px; }
.bp-num { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.bp-de { font: 500 12px/1 var(--font-data); color: var(--muted); }
.bp-fase { grid-column: 1 / -1; font: 600 12px/1.1 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.bp-texto { min-width: 0; }
.bp-texto h2 { margin: 0; font: 700 clamp(22px, 1.5vw, 30px)/1.15 var(--font-display); text-wrap: balance; }
.bp-texto p { margin: 4px 0 0; font-size: clamp(15.5px, 1.04vw, 20px); line-height: 1.45; color: var(--ink-2); max-width: 110ch; text-wrap: pretty; }
.bp-ctrl { display: flex; align-items: center; gap: 8px; }
.bp-reloj { display: grid; justify-items: end; margin-right: 6px; }
.bp-reloj time { font: 600 22px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.bp-reloj small { font-size: 11.5px; color: var(--muted); }
.tarjeta-paso {
  position: absolute; left: 16px; top: calc(var(--barra) + 16px); width: min(clamp(470px, 30vw, 620px), calc(100% - 32px)); z-index: 6;
  max-height: calc(100% - var(--barra) - var(--pres-h) - 56px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
  padding: 16px 18px; display: grid; gap: 10px;
}
.tarjeta-paso h3 { margin: 0; font: 700 clamp(21px, 1.35vw, 27px)/1.1 var(--font-display); text-wrap: balance; }
.tarjeta-paso ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tarjeta-paso li { position: relative; padding-left: 16px; font-size: clamp(14.5px, 0.98vw, 19px); line-height: 1.42; }
.tarjeta-paso li::before { content: ""; position: absolute; left: 0; top: 0.58em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.tarjeta-paso li b { font-weight: 600; }

#app[data-presentando="1"] #consola,
#app[data-presentando="1"] .vistas { display: none; }
#app[data-presentando="1"] .lista-despiece {
  left: 16px; right: auto; bottom: calc(var(--pres-h) + 24px); max-height: calc(100% - var(--barra) - var(--pres-h) - 56px); overflow: auto;
}
/* Con el panel de instrumentos a la derecha, las notas pasan a la izquierda */
#app[data-presentando="1"][data-panel-pres="1"] .notas-orador { right: auto; left: 16px; }
/* Paso 7: la lupa es protagonista */
@media (min-width: 861px) {
  #app[data-presentando="1"][data-paso="medicion-plasma"] .lupa {
    display: block; left: 16px; right: auto; top: calc(var(--barra) + 16px); bottom: auto;
    width: min(40vw, 760px); height: min(calc(100% - var(--barra) - var(--pres-h) - 56px), 540px);
  }
  #app[data-paso="medicion-plasma"] .lupa header b { font-size: 16px; }
  #app[data-paso="medicion-plasma"] .lupa header small { font-size: 13px; }
  #app[data-paso="medicion-plasma"] .lupa .leyenda-lupa { font-size: 14px; gap: 6px 14px; padding: 10px 14px; }
  #app[data-paso="medicion-plasma"] .lupa .leyenda-lupa i { width: 10px; height: 10px; }
}
#app[data-presentando="1"]:not([data-panel-pres="1"]) #instrumentos { display: none; }
#app[data-presentando="1"] #instrumentos { bottom: calc(var(--pres-h) + 24px); }
#app[data-presentando="1"] .lupa { bottom: calc(var(--pres-h) + 24px); right: 16px; }
#app[data-presentando="1"][data-panel-pres="1"] .lupa { right: calc(var(--der) + 24px); }
#app[data-presentando="1"] .pieza { left: auto; right: 16px; top: calc(var(--barra) + 16px); bottom: auto; }
#app[data-presentando="1"][data-panel-pres="1"] .pieza { right: calc(var(--der) + 24px); }
#app[data-presentando="1"] .alarmas { left: 50%; right: auto; top: calc(var(--barra) + 16px); bottom: auto; transform: translateX(-50%); }

/* ---------- etiquetas 3D ---------- */
#etiquetas { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.etq {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 4px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font: 500 11.5px/1.3 var(--font-body);
}
.etq b { font: 600 10.5px/1 var(--font-data); color: var(--accent); white-space: nowrap; }
.etq.num { width: 24px; height: 24px; padding: 0; justify-content: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: 0; font: 600 12px/1 var(--font-data); transform: translate(-50%, -50%); }
.etq:hover { border-color: var(--accent); z-index: 1; }

/* ---------- ficha técnica ---------- */
dialog.ficha { width: min(1040px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid); color: var(--ink); box-shadow: var(--shadow); }
dialog.ficha::backdrop { background: rgba(8, 11, 16, 0.5); }
.ficha-cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface-solid); z-index: 1; }
.ficha-cab h2 { margin: 0; font: 700 22px/1.1 var(--font-display); }
.ficha-cab .cerrar { margin-left: auto; }
.ficha .pestanas { position: sticky; top: 61px; background: var(--surface-solid); z-index: 1; }
.ficha-cuerpo { padding: 16px 18px 22px; display: grid; gap: 14px; }
.ficha-cuerpo p { margin: 0; max-width: 72ch; color: var(--ink-2); }
.ficha-cuerpo h3 { margin: 6px 0 0; font: 700 16px/1.2 var(--font-display); letter-spacing: 0.02em; }
.tabla-ficha-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tabla-ficha { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 12.5px; }
.tabla-ficha th, .tabla-ficha td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tabla-ficha th { font: 600 11px/1.2 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.tabla-ficha tr:last-child td { border-bottom: 0; }
.tabla-ficha td.mono { font-family: var(--font-data); font-size: 12px; white-space: nowrap; }
.marca-resp { display: inline-block; font: 600 10.5px/1.5 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.marca-resp[data-r="revision"] { background: var(--accent-soft); color: var(--accent); }
.marca-resp[data-r="ingenieria"] { background: var(--surface-2); color: var(--ink-2); }
.refs { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.refs a { color: var(--accent); word-break: break-all; }
.lista-simple { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); max-width: 80ch; }
.lista-celda { margin: 0; padding-left: 16px; display: grid; gap: 4px; }

/* ---------- navegación móvil ---------- */
.nav-movil { display: none; }

@media (max-height: 780px) and (min-width: 861px) {
  .portada { padding-block: 12px; }
  .portada-tarjeta { gap: 10px; padding: 18px 26px; }
  .portada h1 { font-size: 36px; }
  .portada .pregunta { font-size: 15.5px; }
  .hipotesis { font-size: 13.5px; padding: 8px 12px; }
  .boton.grande { height: 40px; }
}
@media (max-width: 1240px) {
  :root { --izq: 284px; --der: 332px; }
  .lupa { width: 280px; height: 200px; }
  .pieza { width: 260px; }
  .alarmas { width: 280px; }
}
@media (max-width: 1020px) {
  .lupa { display: none; }
  .lista-despiece { display: none; }
  .pieza { width: 260px; }
}
@media (max-width: 860px) {
  :root { --barra: 52px; }
  .barra { gap: 10px; padding: 0 12px; }
  .marca strong { font-size: 19px; }
  .marca small { display: none; }
  .reloj { display: none; }
  .barra .boton span { display: none; }
  #visor { height: 54%; }
  .vistas { left: 8px; right: 8px; top: calc(var(--barra) + 8px); justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .panel { top: 54%; bottom: 0; left: 0 !important; right: 0 !important; width: auto !important; border-radius: 12px 12px 0 0; padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  .panel[data-oculto="1"] { display: none; }
  #app[data-escena="1"] #visor { height: calc(100% - 52px - env(safe-area-inset-bottom, 0px)); }
  #app[data-escena="1"] .pieza { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .nav-movil {
    display: grid; grid-template-columns: repeat(3, 1fr); position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    height: calc(52px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface-solid); border-top: 1px solid var(--line);
  }
  .nav-movil button { border: 0; background: transparent; font: 600 14px/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .nav-movil button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
  .lupa { display: block; right: 8px; bottom: auto; top: calc(var(--barra) + 52px); width: 168px; height: 120px; }
  .lupa .leyenda-lupa, .lupa header small { display: none; }
  .pieza { left: 8px; right: 8px; top: auto; bottom: calc(46% + 8px); width: auto; max-height: 34%; overflow: auto; }
  .alarmas { left: 8px; right: 184px; width: auto; top: calc(var(--barra) + 52px); bottom: auto; }
  .etq { font-size: 10.5px; }
  .barra .boton#btn-presentar { padding: 0 10px; }
  .estado { gap: 6px; }
  .pastilla { min-width: 0; padding: 0 10px; }
  #pastilla-txt { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #app[data-presentando="1"] #visor { height: 100%; }
  #app[data-presentando="1"] .nav-movil, #app[data-presentando="1"] #instrumentos { display: none; }
  #app[data-presentando="1"] .lupa { top: calc(var(--barra) + 8px); bottom: auto; right: 8px; }
  #app[data-presentando="1"] .pieza { left: 8px; right: 8px; top: auto; bottom: calc(var(--pres-h) + 16px); }
  #app[data-presentando="1"] .lista-despiece { display: none; }
  /* En el teléfono no caben a la vez la tarjeta del paso y la ficha de la pieza */
  #app[data-presentando="1"]:has(.tarjeta-paso:not([hidden])) .pieza { display: none; }
  .barra-pres { left: 6px; right: 6px; bottom: 6px; padding: 6px 12px 10px; min-height: 0; }
  .bp-cuerpo { grid-template-columns: 1fr; gap: 6px; }
  .bp-meta { grid-template-columns: auto auto auto; }
  .bp-fase { grid-column: auto; }
  .bp-num { font-size: 24px; }
  .bp-texto h2 { font-size: 18px; }
  .bp-texto p { font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .bp-ctrl { justify-content: flex-end; flex-wrap: wrap; }
  .tarjeta-paso { top: calc(var(--barra) + 8px); left: 8px; width: calc(100% - 16px - 176px); padding: 10px 12px; }
  .tarjeta-paso h3 { font-size: 16px; }
  .tarjeta-paso li { font-size: 12.5px; }
  .variables { grid-template-columns: 1fr; }
  .portada-tarjeta { padding: 20px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .pastilla[data-at="1"] i { animation: none; }
}
</style>

</head>
<body>
<div id="app">
  <canvas id="visor" aria-label="Modelo 3D del banco de plasma frío"></canvas>
  <div id="etiquetas" aria-hidden="false"></div>

  <header class="barra">
    <div class="marca">
      <small>Banco DBD · escala de laboratorio</small>
      <strong>Pirólisis en frío</strong>
    </div>
    <div class="estado">
      <span class="pastilla" id="pastilla" data-fase="reposo" data-at="0"><i></i><span id="pastilla-txt">Reposo</span></span>
      <span class="reloj" id="reloj">t = 00:00 · ×10</span>
      <button class="boton primario" id="btn-presentar" type="button">Presentar</button>
      <button class="boton" id="btn-ficha" type="button" aria-haspopup="dialog">Ficha<span>&nbsp;técnica</span></button>
    </div>
  </header>

  <nav class="vistas" aria-label="Vistas de la escena">
    <div class="grupo-seg" role="group" aria-label="Cámara">
      <button type="button" data-vista="general" aria-pressed="true">General</button>
      <button type="button" data-vista="gases" aria-pressed="false">Gases</button>
      <button type="button" data-vista="reactor" aria-pressed="false">Reactor</button>
      <button type="button" data-vista="descarga" aria-pressed="false">Descarga</button>
      <button type="button" data-vista="instrumentos" aria-pressed="false">Instrumentos</button>
    </div>
    <div class="control-despiece">
      <label for="rng-despiece">Despiece</label>
      <input type="range" id="rng-despiece" min="0" max="100" value="0">
      <output id="out-despiece" for="rng-despiece">0 %</output>
    </div>
    <div class="grupo-seg" role="group" aria-label="Capas">
      <button type="button" id="tg-corte" aria-pressed="false">Corte</button>
      <button type="button" id="tg-etiquetas" aria-pressed="true">Etiquetas</button>
      <button type="button" id="tg-lupa" aria-pressed="true">Lupa</button>
    </div>
  </nav>

  <aside class="panel izq" id="consola" aria-label="Consola de proceso"></aside>
  <aside class="panel der" id="instrumentos" aria-label="Instrumentación"></aside>

  <section class="lupa" id="lupa" aria-label="Vista ampliada de la descarga">
    <header><b>Lupa · descarga</b><small id="lupa-info">esquemático, sin escala</small></header>
    <div class="leyenda-lupa" id="leyenda-lupa"></div>
  </section>

  <section class="lista-despiece" id="lista-despiece" hidden aria-label="Lista de piezas del despiece">
    <header><b>Despiece de la celda</b><small>Seleccione una pieza</small></header>
    <ol id="lista-piezas"></ol>
  </section>

  <section class="pieza" id="pieza" hidden aria-live="polite"></section>
  <div class="alarmas" id="alarmas" aria-live="polite"></div>

  <nav class="nav-movil" aria-label="Paneles">
    <button type="button" data-panel="consola" aria-selected="true">Proceso</button>
    <button type="button" data-panel="instrumentos" aria-selected="false">Instrumentos</button>
    <button type="button" data-panel="ninguno" aria-selected="false">Escena</button>
  </nav>

:`${p?"+":""}${Se(L,1)} %`,color:et.accent,sy:f}],L=>`t = ${Se(L,0)} s`)}var Fo={tituloCorto:"Plasma fr\xEDo sobre una manzana",titulo:"Efecto del tiempo de exposici\xF3n a un plasma fr\xEDo de descarga de barrera diel\xE9ctrica (DBD) de 200 W sobre la inactivaci\xF3n de E. coli en la superficie de manzana",pregunta:"\xBFCu\xE1nto aumenta la reducci\xF3n logar\xEDtmica de E. coli sobre la superficie de manzana cuando la exposici\xF3n a un plasma DBD de 200 W pasa de 30 a 240 s? \xBFSe mantiene la muestra en condici\xF3n no t\xE9rmica?",hipotesis:"Como la eficacia depende del tiempo de exposici\xF3n, entre otras variables de proceso (Feizollahi et al., 2021; Niemira et al., 2018), alargar la exposici\xF3n aumentar\xE1 la reducci\xF3n de E. coli hasta el orden de 5,5 log UFC/cm\xB2, valor informado por Kilonzo-Nthenge et al. (2018). Como la energ\xEDa llega a los electrones (1 a 10 eV) y no al material en su conjunto (Okyere et al., 2022), el gas no superar\xE1 los 60 \xB0C informados para equipos de alimentos (Jiang et al., 2022). La temperatura de la manzana se medir\xE1, porque la revisi\xF3n no la informa.",casoReferencia:"Kilonzo-Nthenge et al. (2018): la \xFAnica DBD de la Tabla 3 que informa potencia (200 W) y una reducci\xF3n cuantitativa (5,5 log UFC/cm\xB2 en E. coli, con exposiciones de 30 a 240 s). La revisi\xF3n base clasific\xF3 el equipo como descarga corona; la fuente primaria lo describe como DBD (Tabla 5). Cobertura del banco: parcial. El estudio informa 35 mm, que se interpreta como distancia de tratamiento; el banco trata a 3 mm, porque en el modelo el aire no enciende sobre unos 8 mm con 30 kV (el elevador llega a 20 mm). Adem\xE1s, la revisi\xF3n no informa el gas.",resumen:{independiente:["Tiempo de exposici\xF3n al plasma, de 30 a 240 s"],dependientes:["Reducci\xF3n R = log\u2081\u2080(N\u2080/N)","Temperatura de la muestra y del gas","Energ\xEDa espec\xEDfica (kJ/kg)"],controladas:["Potencia de 200 W, gas y humedad","Separaci\xF3n d, masa e in\xF3culo","Configuraci\xF3n DBD a presi\xF3n atmosf\xE9rica"]},variableIndependiente:"Tiempo de exposici\xF3n al plasma, de 30 a 240 s (intervalo de Kilonzo-Nthenge et al., 2018), fijado con el temporizador de la secuencia (KI-702) del computador de adquisici\xF3n. Los tiempos intermedios son una propuesta de dise\xF1o.",variablesDependientes:["Reducci\xF3n logar\xEDtmica, R = log\u2081\u2080(N\u2080/N), en log UFC/cm\xB2 (Ecuaci\xF3n 1), por recuento en placa, e inactivaci\xF3n, I = (1 \u2212 10\u207B\u1D3F) \xD7 100, en % (Ecuaci\xF3n 2).","Temperatura superficial de la muestra (termograf\xEDa TI-302) y de contacto bajo la muestra (fibra \xF3ptica TT-303), para verificar la condici\xF3n no t\xE9rmica (Lacombe et al., 2017; Niemira et al., 2018).","Temperatura del gas a la salida (TT-301), frente a los 60 \xB0C informados para equipos de alimentos (Jiang et al., 2022).","Energ\xEDa por lote, E = P\xB7t (sonda EI-401, bobina II-402 y condensador JI-403, figura de Lissajous), normalizada por la masa (kJ/kg) y por la reducci\xF3n (kJ/kg por ciclo logar\xEDtmico), como pide la discusi\xF3n del informe.","Mediciones complementarias: especies excitadas, identificadas por espectroscop\xEDa de emisi\xF3n \xF3ptica (AI-501, cualitativa), y ozono a la salida (AI-502, valor ilustrativo: la revisi\xF3n no informa concentraciones)."],variablesControladas:["Potencia: 200 W informados por Kilonzo-Nthenge et al. (2018), asumidos como potencia de descarga; en el banco, \u2248 21,7 kV a 10 kHz (supuesto de ingenier\xEDa).","Frecuencia de la fuente: fija en 10 kHz, dentro del intervalo de 5 a 20 kHz del banco (supuesto: la revisi\xF3n no la informa para las DBD).","Gas de trabajo: aire sint\xE9tico, con el caudal fijado en FIC-101 (supuesto: la revisi\xF3n no informa el gas del estudio).","Humedad del gas de entrada: medida con MT-201, porque el radical OH\u2022 proviene de la disociaci\xF3n del agua (Puente-D\xEDaz, 2024).","Separaci\xF3n barrera\u2013muestra, d: 3 mm en el modelo (supuesto), fijada con el elevador ZI-701, porque la distancia modifica la eficacia (Niemira et al., 2018; Puente-D\xEDaz, 2024).","Matriz y masa: superficie de manzana Golden Delicious, con la masa registrada en la balanza WI-601 (Ott et al., 2022).","Microorganismo e in\xF3culo: E. coli, con la poblaci\xF3n inicial N\u2080 registrada en cada serie.","Configuraci\xF3n: DBD plano-paralela con barreras de vidrio de s\xEDlice, a presi\xF3n atmosf\xE9rica, por lotes y con tratamiento abierto."],control:"Propuesta de dise\xF1o; el informe no describe controles. (1) Control negativo: manzanas inoculadas que pasan el mismo tiempo en la c\xE1mara, con el mismo gas, caudal y humedad, pero sin alta tensi\xF3n, para separar el efecto del plasma del efecto del gas y de la manipulaci\xF3n. (2) Referencia N\u2080: manzanas inoculadas que no entran a la c\xE1mara y se recuentan al inicio de cada serie.",replicas:"Propuesta de dise\xF1o: al menos tres r\xE9plicas independientes por tiempo de exposici\xF3n, cada una con su propia manzana e inoculaci\xF3n, en orden aleatorio; se informan la media y la dispersi\xF3n de R. El informe no indica cu\xE1ntas r\xE9plicas us\xF3 el estudio de referencia.",respaldo:["Kilonzo-Nthenge et al. (2018), Tabla 3: DBD, 200 W, 35 mm, 30 a 240 s; 5,5 log UFC/cm\xB2 en E. coli y 5,3 en Salmonella (\u2265 99,9995 %); datos modelados con una distribuci\xF3n de Weibull.","Tabla 5 del informe: la revisi\xF3n base clasific\xF3 el equipo como descarga corona; la fuente primaria lo describe como DBD.","Feizollahi et al. (2021): la eficacia depende de variables de proceso, de producto y microbiol\xF3gicas. Niemira et al. (2018): la distancia y el tiempo de exposici\xF3n interact\xFAan.","Okyere et al. (2022) y Ecuaci\xF3n 4: electrones de 1 a 10 eV, \u2248 11 605 a 116 045 K; con el gas a 298,15 K, los electrones resultan de 38,9 a 389,2 veces m\xE1s calientes que el gas.","Jiang et al. (2022): equipos de plasma fr\xEDo para alimentos con el gas entre 30 y 60 \xB0C.","Tabla 1 (Feizollahi et al., 2021; Guo et al., 2015; Okyere et al., 2022): la barrera diel\xE9ctrica limita la corriente y evita arcos; encendido del orden de 10 kV.","Song et al. (2023): en la decloraci\xF3n de PVC, energ\xEDa de activaci\xF3n aparente de 23,62 kJ/mol con plasma frente a 137,09 kJ/mol con pir\xF3lisis (5,8 veces menor).","Siciliano et al. (2016): en avellanas, la temperatura aument\xF3 hasta en 28,9 \xB0C con 1 000 W durante 12 min. Lacombe et al. (2017) y Niemira et al. (2018) verificaron la condici\xF3n no t\xE9rmica con termograf\xEDa infrarroja.","Puente-D\xEDaz (2024): especies reactivas O, O\u2083, OH\u2022, H\u2082O\u2082 y NO\u2093, adem\xE1s de radiaci\xF3n UV; en las bacterias Gram negativas predominar\xEDan la fuga de contenido celular y el da\xF1o del ADN. Burducea et al. (2023): en un chorro de helio se identificaron NO, OH, N\u2082, N\u2082\u207A y O.","Dasan y Boyaci (2018): con chorro de plasma, 4,02 log en jugo de manzana frente a 1,43 log en jugo de tomate. Ott et al. (2022): en queso fresco, menor eficacia a mayor masa. Niemira et al. (2018): alejar la muestra de 5 a 7,5 cm redujo la inactivaci\xF3n en 0,45 y 0,44 ciclos con 5 y 10 s, respectivamente; sin diferencia a los 15 s.","Discusi\xF3n del informe: E = P\xB7t debe normalizarse en kJ/kg y kJ/kg por ciclo logar\xEDtmico. Yepez et al. (2022): la regulaci\xF3n exige monitoreo, control del proceso y protecci\xF3n de los trabajadores."]},ni="kilonzo_ecoli",$s=[{id:"pregunta",titulo:"La pregunta del experimento",fase:"Pregunta",duracionSeg:65,acciones:{vista:"general",caso:ni,proceso:"reposo",tarjeta:{titulo:"Pregunta del experimento",lineas:["Pregunta: \xBFcu\xE1nto aumenta la reducci\xF3n de E. coli sobre manzana si la exposici\xF3n pasa de 30 a 240 s?","Temperatura: \xBFse mantiene la muestra en condici\xF3n no t\xE9rmica?","Referencia: Kilonzo-Nthenge et al. (2018), Tabla 3","Escala: banco DBD de 200 W, de laboratorio, a presi\xF3n atmosf\xE9rica y por lotes"]}},textoPantalla:"Datos: solo de la revisi\xF3n; equipos y dimensiones: supuestos de ingenier\xEDa. \xABPir\xF3lisis en fr\xEDo\xBB es un t\xE9rmino de trabajo: el plasma rompe enlaces sin calentar el material en su conjunto. PVC: energ\xEDa de activaci\xF3n aparente de 23,62 kJ/mol con plasma y 137,09 kJ/mol con pir\xF3lisis.",guionOral:"Les presento un banco de plasma fr\xEDo de descarga de barrera diel\xE9ctrica, o DBD. Sus datos provienen solo de nuestra revisi\xF3n bibliogr\xE1fica; los equipos y sus dimensiones son supuestos de ingenier\xEDa. Lo recorreremos como un experimento de laboratorio. Una precisi\xF3n: la pir\xF3lisis es la descomposici\xF3n t\xE9rmica de un material en ausencia de ox\xEDgeno. El plasma fr\xEDo, en cambio, no calienta el material en su conjunto: rompe enlaces con electrones energ\xE9ticos, especies reactivas y radiaci\xF3n UV, y en la mayor\xEDa de los estudios opera con ox\xEDgeno. Por eso, \xABpir\xF3lisis en fr\xEDo\xBB es un t\xE9rmino de trabajo. La analog\xEDa tiene respaldo: al declorar PVC, la energ\xEDa de activaci\xF3n aparente fue 5,8 veces menor con plasma que con pir\xF3lisis. La pregunta, en la tarjeta: \xBFcu\xE1nto aumenta la reducci\xF3n de E. coli sobre una manzana si la exposici\xF3n pasa de 30 a 240 segundos? \xBFY se mantiene la muestra en condici\xF3n no t\xE9rmica?",mensajeClave:"Todo el recorrido responde una sola pregunta medible; \xABpir\xF3lisis en fr\xEDo\xBB es un t\xE9rmino de trabajo con respaldo en la decloraci\xF3n de PVC.",queMirar:"Con un gesto amplio, el banco completo (gases, celda en la jaula e instrumentos); despu\xE9s, la tarjeta con la pregunta y la comparaci\xF3n del PVC en la barra inferior."},{id:"hipotesis",titulo:"Hip\xF3tesis: m\xE1s exposici\xF3n, m\xE1s reducci\xF3n, sin calentar",fase:"Hip\xF3tesis",duracionSeg:65,acciones:{vista:"reactor",corte:!0,caso:ni,proceso:"reposo",resaltar:"barreraSup",etiquetas:[],tarjeta:{titulo:"Las dos partes de la hip\xF3tesis",lineas:["Ecuaci\xF3n 4: T\u2091 = E / k, con k la constante de Boltzmann","Electrones (1 a 10 eV): T\u2091 \u2248 11 605 a 116 045 K","Gas a 298 K: electrones 39 a 389 veces m\xE1s calientes","Predicci\xF3n t\xE9rmica: el gas no supera los 60 \xB0C de los equipos para alimentos","Predicci\xF3n temporal: m\xE1s tiempo, m\xE1s reducci\xF3n, hasta el orden de 5,5 log","Cin\xE9tica: el estudio us\xF3 Weibull; la recta del panel es solo un supuesto"]}},textoPantalla:"Como la energ\xEDa va a los electrones, el gas no superar\xE1 60 \xB0C; la temperatura de la manzana se medir\xE1. Como la eficacia depende del tiempo, m\xE1s exposici\xF3n dar\xE1 m\xE1s reducci\xF3n de E. coli, hasta el orden de 5,5 log.",guionOral:"La hip\xF3tesis tiene dos partes. La primera es f\xEDsica: en un plasma fr\xEDo, los electrones alcanzan energ\xEDas de entre 1 y 10 electronvoltios, mientras las part\xEDculas pesadas siguen cerca de la temperatura ambiente. Con la Ecuaci\xF3n 4, 1 electronvoltio equivale a unos 11 600 kelvin, y 10 electronvoltios, a unos 116 000. Con el gas a 298 kelvin, los electrones est\xE1n entre 39 y 389 veces m\xE1s calientes que el gas. Por eso predecimos que el gas no superar\xE1 los 60 grados de los equipos para alimentos; la temperatura de la manzana la mediremos, porque la revisi\xF3n no la informa. La segunda parte viene de la literatura: la eficacia depende del tiempo de exposici\xF3n, entre otras variables. Predecimos m\xE1s reducci\xF3n con m\xE1s tiempo, hasta el orden de 5,5 ciclos logar\xEDtmicos, el valor de Kilonzo-Nthenge y colaboradores. No suponemos una recta: los autores usaron una distribuci\xF3n de Weibull.",mensajeClave:"La parte t\xE9rmica de la hip\xF3tesis se deduce del no equilibrio; la parte temporal, de la literatura y del caso de referencia.",queMirar:"La tarjeta de arriba abajo; luego, en el corte de la celda, la barrera superior resaltada y el espacio bajo ella, donde se formar\xE1 el plasma."},{id:"diseno",titulo:"Dise\xF1o: qu\xE9 cambiamos, qu\xE9 medimos y qu\xE9 fijamos",fase:"Dise\xF1o experimental",duracionSeg:60,acciones:{vista:"general",caso:ni,proceso:"reposo",tarjeta:{titulo:"Dise\xF1o experimental",lineas:["Independiente: tiempo de exposici\xF3n, de 30 a 240 s","Dependientes: R = log\u2081\u2080(N\u2080/N), temperatura de la muestra y del gas, energ\xEDa espec\xEDfica","Controladas: 200 W, gas, humedad, separaci\xF3n d, masa e in\xF3culo","Control: c\xE1mara con gas y sin alta tensi\xF3n (propuesta de dise\xF1o)","R\xE9plicas: al menos tres por tiempo, en orden aleatorio (propuesta de dise\xF1o)"]}},textoPantalla:"Se manipula una sola variable: el tiempo. Se miden la reducci\xF3n logar\xEDtmica, la temperatura y la energ\xEDa; lo dem\xE1s queda fijo. El control sin descarga y las r\xE9plicas son propuestas de dise\xF1o, no datos del informe.",guionOral:"En este experimento cambiamos una sola cosa: el tiempo de exposici\xF3n, de 30 a 240 segundos. Medimos tres respuestas. Primero, la reducci\xF3n logar\xEDtmica de la Ecuaci\xF3n 1: el logaritmo del cociente entre la poblaci\xF3n inicial y la final, contadas en placa. Segundo, la temperatura de la muestra y del gas, para comprobar que el proceso es no t\xE9rmico. Tercero, la energ\xEDa por lote. Lo dem\xE1s queda fijo: potencia, gas, humedad, separaci\xF3n, masa e in\xF3culo, porque la eficacia depende de variables de proceso, de producto y microbiol\xF3gicas. Dos elementos son propuestas nuestras, no datos del informe. El primero es un control: manzanas inoculadas que pasan el mismo tiempo en la c\xE1mara, con el mismo gas, pero sin alta tensi\xF3n. As\xED separamos el efecto del plasma del efecto del gas y de la manipulaci\xF3n. El segundo: al menos tres r\xE9plicas por tiempo, en orden aleatorio.",mensajeClave:"Se cambia una sola variable y se fija el resto; el control sin descarga y las r\xE9plicas son propuestas de dise\xF1o.",queMirar:"La tarjeta l\xEDnea por l\xEDnea, marcando con la mano \xABpropuesta de dise\xF1o\xBB."},{id:"montaje",titulo:"Montaje: la celda DBD por dentro",fase:"Montaje",duracionSeg:60,acciones:{vista:"despiece",despiece:.8,caso:ni,proceso:"reposo",resaltar:"barreraSup"},textoPantalla:"Celda DBD plano-paralela: electrodos de \xD8 100 mm y barreras de vidrio de s\xEDlice, que limitan la corriente y evitan arcos. Una plataforma elevadora microm\xE9trica ajusta la separaci\xF3n d entre 1 y 20 mm. Los materiales (salvo la s\xEDlice) y las dimensiones son supuestos.",guionOral:"Ahora, el montaje. Separamos la celda en sus quince piezas numeradas; la lista est\xE1 a la izquierda. Arriba est\xE1n el pasamuros y el electrodo de alta tensi\xF3n; abajo, el electrodo de tierra. Los dos electrodos son de aluminio, un supuesto del banco. Entre ellos est\xE1 lo que define a una DBD: la barrera diel\xE9ctrica, aqu\xED de vidrio de s\xEDlice, uno de los materiales que menciona la revisi\xF3n. La barrera limita la corriente y evita los arcos; el modelo muestra las microdescargas como filamentos breves, en forma esquem\xE1tica. La muestra, pieza seis, descansa sobre una plataforma elevadora microm\xE9trica, que ajusta la separaci\xF3n entre 1 y 20 mil\xEDmetros. Esa separaci\xF3n es una variable controlada, porque cambia las especies que llegan al alimento. La ventana de cuarzo deja pasar la luz hacia el espectr\xF3metro, y la infrarroja, hacia la c\xE1mara termogr\xE1fica.",mensajeClave:"La barrera diel\xE9ctrica define la DBD, y cada ventana de la c\xE1mara existe para un instrumento.",queMirar:"La barrera superior resaltada (pieza 4) y su ficha; en la lista, los electrodos (3 y 8), la muestra (6), la plataforma elevadora (9) y las ventanas (12 y 13)."},{id:"procedimiento",titulo:"Procedimiento: masa, puerta y purga",fase:"Procedimiento",duracionSeg:55,acciones:{vista:"gases",caso:ni,proceso:"purga",etiquetas:["cilAux","panelMFC","humidificador","sensorHR","balanza"]},textoPantalla:"Secuencia: pesaje e inoculaci\xF3n \u2192 ajuste de la separaci\xF3n d \u2192 cierre de la puerta \u2192 purga (caudal y humedad) \u2192 alta tensi\xF3n \u2192 postpurga \u2192 recuento en placa. Gas: aire sint\xE9tico (supuesto; la revisi\xF3n no lo informa).",guionOral:"El procedimiento sigue un orden fijo, que ven abajo en la pantalla. Primero pesamos la muestra en una balanza con resoluci\xF3n de 0,01 gramos: la masa cambia la eficacia y sirve para calcular la energ\xEDa espec\xEDfica. Luego ajustamos la separaci\xF3n y cerramos la puerta de la jaula, que tiene enclavamiento. Despu\xE9s purgamos la c\xE1mara. Con aire sint\xE9tico, solo el primer controlador de caudal trabaja; los otros dos quedan para preparar mezclas. Un sensor registra la humedad. \xBFPor qu\xE9 medirla? Porque el radical hidroxilo se forma por disociaci\xF3n del agua, y el gas, la humedad y la distancia definen la mezcla de especies reactivas. Usamos aire sint\xE9tico, pero es un supuesto: la revisi\xF3n no informa el gas de este estudio. Al final vendr\xE1n la postpurga, que retira el ozono, y el recuento en placa.",mensajeClave:"Un orden fijo hace comparables los lotes; el gas y la humedad se miden porque determinan las especies reactivas.",queMirar:"Los cilindros, el panel de controladores (FIC-101 a 103; solo el primero con caudal), el humidificador y el sensor MT-201; seguir la purga por la tuber\xEDa hasta la celda."},{id:"medicion-electrica",titulo:"Medici\xF3n I: tensi\xF3n, corriente y energ\xEDa",fase:"Medici\xF3n",duracionSeg:60,acciones:{vista:"instrumentos",caso:ni,proceso:"tratamiento",avance:.15,panel:"instrumentos",tab:"electrico",ancla:"energia",resaltar:"capMedida",etiquetas:["sondaAT","rogowski","capMedida","osciloscopio","fuente"]},textoPantalla:"Alta tensi\xF3n encendida. Sonda de alta tensi\xF3n: tensi\xF3n; bobina de Rogowski: corriente; condensador de medida: carga. La figura de Lissajous da la potencia; con E = P\xB7t y la masa se informan kJ/kg y kJ/kg por ciclo logar\xEDtmico. Tensi\xF3n y potencia del banco: supuestos.",guionOral:"Encendemos la alta tensi\xF3n. En el modelo, con aire y 3 mil\xEDmetros de separaci\xF3n, la descarga se enciende cerca de 14,7 kilovoltios. Con 21,7 kilovoltios a 10 kilohercios entrega unos 200 vatios, ajustados para igualar los 200 que informa el estudio. Tratar esa cifra como potencia de descarga es un supuesto nuestro: la revisi\xF3n no lo precisa. Ese encendido sale de una correlaci\xF3n emp\xEDrica, otro supuesto, y es del mismo orden que los 10 kilovoltios que la revisi\xF3n informa para la DBD. \xBFPara qu\xE9 tres instrumentos el\xE9ctricos? La sonda mide la tensi\xF3n; la bobina de Rogowski, la corriente; y el condensador de medida, la carga. Al graficar la carga contra la tensi\xF3n se obtiene la figura de Lissajous, y de ella, la potencia. Dividiendo la energ\xEDa por la masa y por los ciclos logrados, obtenemos la energ\xEDa espec\xEDfica que pide el informe.",mensajeClave:"Medir tensi\xF3n, corriente y carga permite informar la energ\xEDa espec\xEDfica que el informe pide para comparar procesos.",queMirar:"La sonda, la bobina y el condensador resaltado, con sus etiquetas; en la pesta\xF1a El\xE9ctrico, la figura de Lissajous y la energ\xEDa del lote. La baliza encendida sobre la jaula."},{id:"medicion-plasma",titulo:"Medici\xF3n II: especies reactivas y temperatura",fase:"Medici\xF3n",duracionSeg:60,acciones:{vista:"descarga",corte:!0,lupa:!0,caso:ni,proceso:"tratamiento",avance:.5,panel:"instrumentos",tab:"gas",ancla:"ozono",etiquetas:[]},textoPantalla:"Lupa esquem\xE1tica, sin escala. Electrones \u2192 O, O\u2083, OH\u2022, H\u2082O\u2082, NO\u2093 y radiaci\xF3n UV sobre la superficie. Espectr\xF3metro: identifica especies, sin cuantificarlas; monitor de ozono (absorci\xF3n UV): O\u2083 a la salida. Ozono y temperaturas del panel: valores ilustrativos.",guionOral:"Acerqu\xE9monos a la descarga. La lupa es esquem\xE1tica y sin escala. Los choques de los electrones con el gas y el vapor de agua inician una cadena que forma ox\xEDgeno at\xF3mico, ozono, radical hidroxilo, per\xF3xido de hidr\xF3geno y \xF3xidos de nitr\xF3geno, adem\xE1s de radiaci\xF3n UV. Seg\xFAn la revisi\xF3n base, en las bacterias Gram negativas predominar\xEDan la fuga de contenido celular y el da\xF1o del ADN. El espectr\xF3metro buscar\xEDa especies como \xF3xido n\xEDtrico, hidroxilo, nitr\xF3geno y ox\xEDgeno at\xF3mico, identificadas en un chorro de helio; en aire, la mezcla puede ser distinta. El monitor mide el ozono a la salida. La temperatura se mide en el gas, en la superficie y en contacto bajo la muestra; el panel grafica las dos primeras. El sustrato s\xED puede calentarse: en avellanas, con 1 000 vatios durante 12 minutos, la temperatura aument\xF3 hasta en 28,9 grados Celsius.",mensajeClave:"Las especies reactivas son el mecanismo de da\xF1o, no el calor; aun as\xED, la temperatura se mide en tres puntos.",queMirar:"En la lupa ampliada: electrones blancos, filamentos, especies de colores y c\xE9lulas que se da\xF1an. Luego, la pesta\xF1a Gas y temperatura, marcando que sus valores son ilustrativos."},{id:"resultado",titulo:"Resultado de referencia: hasta 5,5 ciclos logar\xEDtmicos",fase:"Resultado",duracionSeg:60,acciones:{vista:"reactor",corte:!0,caso:ni,proceso:"final",panel:"instrumentos",tab:"resultado",etiquetas:[]},textoPantalla:"Dato de la literatura, no medici\xF3n propia: hasta 5,5 log UFC/cm\xB2 (99,9997 %) en E. coli, con DBD de 200 W y exposiciones de 30 a 240 s. La ubicaci\xF3n del punto a los 240 s y la trayectoria de primer orden son supuestos del modelo.",guionOral:"Atenci\xF3n: este resultado no lo medimos nosotros. Es el valor que informaron Kilonzo-Nthenge y colaboradores con una DBD de 200 vatios: hasta 5,5 ciclos logar\xEDtmicos en E. coli y 5,3 en Salmonella. Seg\xFAn la Ecuaci\xF3n 2, una reducci\xF3n de 5,5 ciclos equivale a inactivar el 99,9997 % de la poblaci\xF3n: sobreviven unas 3 bacterias de cada mill\xF3n. La literatura respalda esa magnitud en exposiciones de 30 a 240 segundos, pero la revisi\xF3n no informa c\xF3mo cambia la reducci\xF3n con el tiempo ni en qu\xE9 momento se alcanz\xF3 el m\xE1ximo. Esa relaci\xF3n es justamente lo que medir\xEDa el experimento, descontando el resultado del control sin descarga. La lectura cr\xEDtica: ubicar el punto a los 240 segundos y unirlo con una recta de primer orden son supuestos del modelo, porque los autores usaron Weibull. La temperatura de la manzana tampoco est\xE1 informada: queda por medir.",mensajeClave:"El valor viene de la literatura: respalda la magnitud alcanzable, no la relaci\xF3n con el tiempo, que es lo que medir\xEDa el experimento.",queMirar:"En la pesta\xF1a Resultado, el punto en 5,5 log y el aviso que separa el dato informado de la trayectoria supuesta."},{id:"analisis",titulo:"An\xE1lisis: l\xEDmites de la comparaci\xF3n",fase:"An\xE1lisis",duracionSeg:65,acciones:{vista:"reactor",corte:!0,caso:ni,proceso:"final",resaltar:"elevador",etiquetas:[],tarjeta:{titulo:"Limitaciones y validez",lineas:["Separaci\xF3n: el estudio informa 35 mm (distancia de tratamiento); el banco trata a 3 mm","Encendido: en el modelo, el aire no enciende sobre \u2248 8 mm con 30 kV","Gas: no informado; el banco usa aire (supuesto)","Clasificaci\xF3n: descarga corona en la revisi\xF3n base; DBD en la fuente primaria","Matriz: con chorro de plasma (Dasan y Boyaci, 2018), E. coli baj\xF3 4,02 log en jugo de manzana y 1,43 en jugo de tomate"]}},textoPantalla:"Cobertura parcial: el estudio informa 35 mm y el banco trata a 3 mm; la revisi\xF3n no informa el gas. La eficacia es propiedad del sistema plasma\u2013matriz\u2013microorganismo: un resultado sobre manzana no se extrapola a otra matriz.",guionOral:"Primero, las limitaciones. Una: el estudio informa 35 mil\xEDmetros, que interpretamos como la distancia de tratamiento. Nuestro elevador llega a 20, pero el banco trata a 3: con 30 kilovoltios, el aire del modelo no enciende sobre unos 8 mil\xEDmetros. Dos: la revisi\xF3n no informa el gas; usar aire es un supuesto. Tres: la revisi\xF3n base clasific\xF3 este equipo como descarga corona, y la fuente primaria lo describe como DBD. La eficacia no es una propiedad del equipo, sino del sistema formado por el plasma, la matriz y el microorganismo. Con el mismo chorro de plasma, la poblaci\xF3n de E. coli baj\xF3 4,02 ciclos en jugo de manzana y solo 1,43 en jugo de tomate: 389 veces m\xE1s sobrevivientes en el tomate. En queso fresco, m\xE1s masa signific\xF3 menos eficacia. Y en biopel\xEDculas, alejar la muestra de 5 a 7,5 cent\xEDmetros rest\xF3 0,45 ciclos con 5 segundos de exposici\xF3n, pero no a los 15.",mensajeClave:"La eficacia pertenece al sistema plasma\u2013matriz\u2013microorganismo, y el banco cubre el caso de referencia solo en forma parcial.",queMirar:"La plataforma elevadora resaltada y su ficha (alcance de 20 mm; el banco trata a 3 mm); despu\xE9s, la tarjeta de limitaciones l\xEDnea por l\xEDnea."},{id:"conclusion",titulo:"Conclusi\xF3n del experimento",fase:"Conclusi\xF3n",duracionSeg:60,acciones:{vista:"general",caso:ni,proceso:"final",puerta:"abrir",resaltar:"puerta",tarjeta:{titulo:"Conclusi\xF3n",lineas:["Factibilidad: la pregunta es medible en un banco DBD de laboratorio","Referencia: hasta 5,5 log sobre manzana; no extrapolable","Validez: control sin descarga y r\xE9plicas (propuestas de dise\xF1o), m\xE1s verificaci\xF3n t\xE9rmica","Energ\xEDa: informar kJ/kg y kJ/kg por ciclo logar\xEDtmico","\xABPir\xF3lisis en fr\xEDo\xBB: romper enlaces con electrones, no con calor"]}},textoPantalla:"C\xE1mara purgada y puerta abierta: el enclavamiento mantiene la fuente sin tensi\xF3n y la muestra va al recuento en placa. La referencia anticipa hasta 5,5 log, un valor v\xE1lido solo para esa matriz, ese equipo y esa distancia.",guionOral:"Con la c\xE1mara ya purgada, abrimos la puerta. El enclavamiento, un supuesto de dise\xF1o del banco, mantiene la fuente sin tensi\xF3n y responde a la protecci\xF3n de los trabajadores que exige la regulaci\xF3n. La manzana sale al recuento en placa. \xBFQu\xE9 concluimos? Primero, la pregunta es medible: el banco var\xEDa solo el tiempo y mide la reducci\xF3n, la temperatura y la energ\xEDa. Segundo, la literatura anticipa hasta 5,5 ciclos sobre manzana, pero ese valor no se extrapola a otra matriz, otro equipo, otro gas u otra distancia. Tercero, la validez exige un control sin descarga y r\xE9plicas, nuestra propuesta de dise\xF1o, adem\xE1s de verificar la temperatura e informar la energ\xEDa espec\xEDfica, como pide el informe. Para la ingenier\xEDa ambiental, el plasma fr\xEDo interesa porque podr\xEDa sustituir sanitizantes qu\xEDmicos. Y \xABpir\xF3lisis en fr\xEDo\xBB resume la idea: romper enlaces con electrones, no con calor. Muchas gracias.",mensajeClave:"El experimento es factible, pero su resultado vale solo para sus condiciones; la validez depende del control, las r\xE9plicas, la verificaci\xF3n t\xE9rmica y la energ\xEDa espec\xEDfica.",queMirar:"La puerta abierta de la jaula, resaltada (sin baliza ni descarga), y la tarjeta de conclusi\xF3n; cerrar con un gesto hacia el banco completo."}];var ie=(i,e=document)=>e.querySelector(i),Ue=i=>String(i??"").replace(/[&<>"]/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[e]),cf={N2:"N\u2082",O2:"O\u2082",CO2:"CO\u2082",Ar:"Ar",He:"He"},lf={dentro:"Dentro del alcance",parcial:"Parcial",fuera:"Fuera del alcance"},df=["var(--s1)","var(--s2)","var(--s3)","var(--s4)"],zo=5,uf=3600,m_=i=>{let e=zo*Math.pow(uf/zo,i/1e3);return e<60?Math.round(e):e<600?Math.round(e/5)*5:Math.round(e/30)*30},g_=i=>Math.round(1e3*Math.log(i/zo)/Math.log(uf/zo));function hf(i,{alSeleccionarParte:e}){var y;let t={};for(let v of ha)(t[y=v.grupo]||(t[y]=[])).push(v);let n=`<option value="libre">${Ue(Bs.nombre)}</option>`+Object.entries(t).map(([v,_])=>`<optgroup label="${Ue(v)}">${_.map(w=>`<option value="${w.id}">${Ue(w.nombre)}</option>`).join("")}</optgroup>`).join(""),a=Object.entries(ua).map(([v,_])=>`<option value="${v}">${Ue(_.nombre)}</option>`).join("");ie("#consola").innerHTML=`
